services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: closeloop-postgres
    environment:
      POSTGRES_DB: closeloop
      POSTGRES_USER: closeloop
      POSTGRES_PASSWORD: closeloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closeloop -d closeloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: closeloop-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://closeloop:closeloop@postgres:5432/closeloop
      - PYTHONUNBUFFERED=1
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: closeloop-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: