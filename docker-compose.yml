version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: closeloop-postgres

    environment:
      POSTGRES_DB: closeloop
      POSTGRES_USER: closeloop
      POSTGRES_PASSWORD: closeloop

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: