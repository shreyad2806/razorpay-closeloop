# Alembic configuration for CloseLoop.
#
# The database URL is intentionally NOT set here. It is read from the
# DATABASE_URL environment variable (loaded from .env by app/database/database.py)
# inside alembic/env.py, so migrations always target the same database the
# application targets and no credential is committed to the repository.
#
# Usage (from the backend/ directory):
#   .venv/Scripts/alembic upgrade head
#   .venv/Scripts/alembic downgrade base
#   .venv/Scripts/alembic current
#   .venv/Scripts/alembic revision -m "describe the change"   # Phase 2 onward

[alembic]
script_location = alembic

# Revision file naming: 0001_phase1_domain_foundation.py style, so the applied
# order is readable from a directory listing.
file_template = %%(rev)s_%%(slug)s

# Timestamps in generated files use UTC.
timezone = UTC

prepend_sys_path = .

version_path_separator = os

# sqlalchemy.url is set at runtime by alembic/env.py from DATABASE_URL.
sqlalchemy.url =


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
